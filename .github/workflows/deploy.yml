how should I proceed after github actions? 

Do not choose GitHub Pages Jekyll or Static HTML. Your Lovable project is almost certainly a Vite/React application, so it must be built before deployment. The correct next step is to create a custom GitHub Actions workflow. Vite’s official deployment guide recommends this approach for GitHub Pages. 

1. Click “create your own”
On the page in your screenshot, click:

create your own
GitHub will open a new workflow file, normally:

.github/workflows/main.yml
Rename it to:

.github/workflows/deploy.yml
2. Replace the contents with this workflow
name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
Then click:

Commit changes
Commit directly to the main branch.

The workflow will install the project dependencies, run the Vite production build and publish the generated dist folder. 

3. Check the Vite base setting
Before testing the temporary GitHub address, open this file in the repository:

vite.config.ts
Your temporary GitHub Pages address will probably be:

https://palmqvistbioprocess.github.io/nordi-biotech-shine/
For that address, the Vite configuration needs:

base: "/nordi-biotech-shine/",
For example:

import { defineConfig } from "vite";
import react from "@vitejs/plugin-react-swc";

export default defineConfig({
  base: "/nordi-biotech-shine/",
  plugins: [react()],
});
Do not replace the rest of the existing configuration. Add only the base property in the existing defineConfig block.

Vite requires the repository name as the base path when publishing under username.github.io/repository-name/. 

Later, when your own domain is connected, you should change it to:

base: "/",
4. Watch the deployment
Open:

Repository → Actions
You should see:

Deploy website to GitHub Pages
Click it and wait for both stages to become green:

build
deploy
This usually takes one or two minutes.

When complete, return to:

Settings → Pages
GitHub should display the published site address.

5. Test the GitHub address first
Open:

https://palmqvistbioprocess.github.io/nordi-biotech-shine/
Check:

page loads correctly

logo and images display

menu works

links work

contact button works

mobile layout works

Do not connect the custom domain until this temporary address works correctly.

6. Enter your custom domain
Once the temporary site works, return to:

Settings → Pages → Custom domain
Enter your actual domain, without https://.

For example:

palmqvistbioprocess.com
or whatever exact .com domain you own.

Click Save.

GitHub recommends entering the custom domain in GitHub before changing the DNS records. 

7. Change the DNS records at one.com
For the root domain, add these four A records:

Type	Host	Value
A	@	185.199.108.153
A	@	185.199.109.153
A	@	185.199.110.153
A	@	185.199.111.153
For the www version, add:

Type	Host	Value
CNAME	www	palmqvistbioprocess.github.io
The CNAME target uses your GitHub username, not the repository name. GitHub documents these records for custom domains. 

Remove any existing conflicting records for the same host, particularly:

another A record for @

an AAAA record pointing elsewhere

a CNAME for www pointing to Lovable

one.com website forwarding records

Do not change your MX records or other email records. Those are needed for your email service.

8. Change the Vite base to /
After the custom domain is entered, edit:

vite.config.ts
Change:

base: "/nordi-biotech-shine/",
to:

base: "/",
Commit the change. GitHub Actions will automatically redeploy the website.

9. Enable HTTPS
After GitHub confirms the DNS configuration, return to:

Settings → Pages
Enable:

Enforce HTTPS
DNS verification and the HTTPS certificate can take several hours, occasionally up to 24 hours. 

Your immediate next action is therefore:

Click “create your own” → paste the workflow above → commit it

